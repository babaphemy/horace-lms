name: Lint and Prettier

on:
  pull_request:
    branches:
      - main
      - release/**

jobs:
  lint-and-prettier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run format check
        run: npm run lint

      - name: Run lint
        run: npm run validate

      - name: Run build
        run: npm run build
